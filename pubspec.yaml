name: warranty_vault
description: "Kipt — An offline-first personal item vault with composable fields, secure password storage, and expiry tracking."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Local Database
  sqflite: ^2.3.3+1
  
  # File & Image Handling
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  path: ^1.9.0
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  
  # Local Storage
  shared_preferences: ^2.3.2
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  
  # Backup & Restore
  archive: ^3.6.1
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  open_file: ^3.5.9
  
  # Utilities
  intl: ^0.19.0
  permission_handler: ^12.0.1
  image_gallery_saver_plus: ^4.0.1
  url_launcher: ^6.3.1
  
  # PDF Generation (used for settings/export backup)
  pdf: ^3.11.1
  printing: ^5.13.3
  
  # Biometric Authentication
  local_auth: ^2.3.0
  
  # Secure Storage (PASSWORD field encryption — Android Keystore / iOS Secure Enclave)
  flutter_secure_storage: ^10.3.1
  camera: ^0.12.0+2
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
    - assets/light_logo.png
    - assets/darklogo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
